# PostgreSQL 16 для Skrezo → /etc/postgresql/16/main/conf.d/skrezo.conf
# Сервер 12 CPU / 47 GB RAM; Postgres делит машину с API, воркерами и Redis.
listen_addresses = 'localhost'
max_connections = 200                  # приложение идёт через PgBouncer (пул 40–50)
shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 32MB
maintenance_work_mem = 1GB
wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1                 # SSD
effective_io_concurrency = 200
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 500       # медленные запросы, мс
log_line_prefix = '%m [%p] %u@%d '
log_checkpoints = on
log_lock_waits = on
# Страховка от «повисших» транзакций; 10 минут — с запасом на ход ассистента,
# который держит транзакцию, пока ждёт модель.
idle_in_transaction_session_timeout = 600000
password_encryption = scram-sha-256
