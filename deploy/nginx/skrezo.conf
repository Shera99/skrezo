# Skrezo API за nginx: два инстанса uvicorn, WebSocket для Socket.IO, лимит тела.
# Установка: cp → /etc/nginx/sites-available/skrezo, заменить api.skrezo.com на свой
# домен, symlink в sites-enabled, `nginx -t`, затем `certbot --nginx -d <домен>` —
# certbot сам добавит TLS-блок и редирект 80 → 443.
#
# Вариант «поддиректория домена» (https://host/skrz/) — см. docs/DEVELOPMENT.md, раздел
# «За обратным прокси»: ROOT_PATH=/skrz и слэш в конце proxy_pass.

# Одновременных загрузок файлов с одного адреса: КТ — сотни мегабайт, и десяток
# параллельных загрузок одного клиента забивает диск и канал. Зона объявляется
# здесь, вне server: файл подключается внутрь http {}.
limit_conn_zone $binary_remote_addr zone=skrezo_uploads:10m;

upstream skrezo_api {
    # Клиент Socket.IO должен попадать в один и тот же процесс (long-polling → websocket):
    # ip_hash закрепляет адрес клиента за инстансом. Комнаты между инстансами
    # синхронизирует шина pg_notify, поэтому события не теряются.
    ip_hash;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gateway.skrezo.com;

    # UPLOAD_MAX_BYTES = 20 MiB + запас на multipart. У загрузки КТ — свой лимит ниже.
    client_max_body_size 25m;

    # Socket.IO: апгрейд до WebSocket, долгие соединения (пинг сервера раз в 25 с).
    location /socket.io/ {
        proxy_pass http://skrezo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Загрузка файлов пациента: КТ (DICOM или ZIP исследования) весит сотни мегабайт.
    # Лимит = UPLOAD_CT_MAX_BYTES (1 ГиБ) + запас на multipart — меняются вместе.
    # Тело сразу уходит в uvicorn, без лишней копии во временных файлах nginx, а
    # загрузка по медленному каналу идёт минутами — отсюда таймауты. Запрос без
    # валидного токена API отвергает до приёма тела (UploadGuardMiddleware).
    location ~ /clinic/patients/[^/]+/files$ {
        client_max_body_size 1100m;
        limit_conn skrezo_uploads 3;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://skrezo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://skrezo_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
