# Redis для Skrezo (очередь arq, OTP, лимиты, кэш префикса) → /etc/redis/skrezo.conf
# Подключить ПОСЛЕДНЕЙ строкой /etc/redis/redis.conf (include позже — переопределяет):
#   echo 'include /etc/redis/skrezo.conf' >> /etc/redis/redis.conf
bind 127.0.0.1 -::1
protected-mode yes
requirepass ЗАМЕНИТЬ_ПАРОЛЬ_REDIS
maxmemory 2gb
# Очередь заданий терять нельзя: при нехватке памяти — ошибка записи, не вытеснение.
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save 900 1
save 300 10
