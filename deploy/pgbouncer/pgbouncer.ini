; PgBouncer для Skrezo → /etc/pgbouncer/pgbouncer.ini
; Приложение ходит на 127.0.0.1:6432 (DATABASE_URL). LISTEN/NOTIFY и миграции идут
; мимо пулера, на 5432 (DATABASE_DIRECT_URL): transaction-режим их не переживает.
[databases]
skrezo = host=127.0.0.1 port=5432 dbname=skrezo

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
; SHOW POOLS / SHOW STATS от имени приложения (пароль тот же, что в DATABASE_URL).
stats_users = skrezo

pool_mode = transaction
; asyncpg готовит запросы на уровне протокола — без этого в transaction-режиме
; «prepared statement "__asyncpg_stmt_N" does not exist» (нужен PgBouncer ≥ 1.21).
max_prepared_statements = 500

max_client_conn = 500
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 5
query_wait_timeout = 30

ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
