[project]
name = "skrezo-platform"
version = "0.1.0"
description = "Skrezo — бэкенд платформенной зоны (админка) и клиентского OTP-входа"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "arq>=0.26",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "phonenumbers>=8.13",
    "httpx>=0.28",
    "structlog>=24.4",
    "orjson>=3.10",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "testcontainers[postgres]>=4.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = [
    "B008",    # FastAPI Depends(...) в аргументах по умолчанию — это норма
    "RUF001",  # «двусмысленная» кириллица в строках — код намеренно на русском
    "RUF002",  # то же для докстрингов
    "RUF003",  # то же для комментариев
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
