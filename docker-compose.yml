# Имя проекта закреплено явно: иначе compose берёт его из имени каталога и может
# «усыновить» контейнеры чужого стека с тем же именем (и снести их по
# --remove-orphans). Хостовые порты — «нестандартные», чтобы соседние проекты на
# этой машине (auth_service и др.) не конфликтовали за 5432/6379/8000.
name: skrezo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skrezo
      POSTGRES_PASSWORD: skrezo
      POSTGRES_DB: skrezo
    ports:
      # 5434 на хосте: 5432 — локальный Postgres, 5433 занят соседним проектом
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skrezo -d skrezo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # 6380 на хосте: 6379 занят Redis соседнего проекта
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://skrezo:skrezo@postgres:5432/skrezo
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      # Снимки и документы пациентов — на диске рядом с проектом. Без этого
      # монтирования они живут внутри контейнера и исчезают при первом же
      # пересоздании: `docker compose up --build` стирал бы медкарты.
      - ./storage:/app/storage
      - ./secrets:/app/secrets:ro
    ports:
      # Только localhost: наружу сервис публикует обратный прокси (TLS + лимиты),
      # иначе в API можно постучаться напрямую по <ip>:8010 мимо nginx.
      # 8010, т.к. 8000 занят API соседнего проекта.
      - "127.0.0.1:8010:8000"
    # Прогоняем миграции и поднимаем API.
    # --forwarded-allow-ips: за прокси клиентский IP приходит в X-Forwarded-For, а
    # peer'ом выступает docker-шлюз (172.x). Без доверия заголовку request.client.host
    # у всех запросов одинаков, и IP-лимиты (OTP, лиды) схлопываются в общий счётчик.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:asgi_app --host 0.0.0.0 --port 8000
             --proxy-headers --forwarded-allow-ips='*'"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://skrezo:skrezo@postgres:5432/skrezo
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    volumes:
      # Тот же каталог, что у api: голосовые и снимки пациентов из WhatsApp
      # скачивает ИМЕННО воркер (process_wa_inbound), а отдаёт их наружу api.
      # Без общего тома файл остаётся в контейнере воркера, и вложение в
      # карточке пациента открывается ошибкой.
      - ./storage:/app/storage
      # Ключи доставки пушей (.p8 APNs, JSON сервис-аккаунта FCM) — пуши
      # рассылает воркер, ему они и нужны.
      - ./secrets:/app/secrets:ro
    # Arq-воркер: очередь задач и cron'ы (подписки, сводки, здоровье ассистента)
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
